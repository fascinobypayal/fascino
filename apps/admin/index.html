<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />

    <!-- Title & meta -->
    <title>Fascino — Admin</title>
    <meta name="title" content="Fascino — Admin" />
    <meta name="description" content="Admin dashboard for Fascino by Payal." />
    <meta name="author" content="Fascino by Payal" />

    <!-- Favicon: SVG monogram (all modern browsers), ICO fallback for legacy. ?v=2 busts cached Lovable icons. -->
    <link rel="icon" href="/favicon.svg?v=2" type="image/svg+xml" />
    <link rel="alternate icon" href="/favicon.ico?v=2" sizes="any" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png?v=2" />

    <!-- PWA / mobile web app -->
    <meta name="theme-color" content="#0a0a0a" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Fascino Admin" />
    <meta name="format-detection" content="telephone=no" />

    <!-- Open Graph (admin panel — no public sharing needed) -->
    <meta property="og:title" content="Fascino — Admin" />
    <meta property="og:description" content="Admin dashboard for Fascino by Payal." />
    <meta property="og:type" content="website" />

    <!-- Safe area for notched devices -->
    <style>
      :root {
        --sat: env(safe-area-inset-top);
        --sar: env(safe-area-inset-right);
        --sab: env(safe-area-inset-bottom);
        --sal: env(safe-area-inset-left);
      }
    </style>

    <!-- Preconnect to Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
