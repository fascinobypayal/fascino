<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    
    <!-- Primary Meta Tags -->
    <title>Fascino – Premium Fashion Store</title>
    <meta name="title" content="Fascino – Premium Fashion Store" />
    <meta name="description" content="Discover curated collections and premium fashion at Fascino." />
    <meta name="author" content="Fascino – By Payal" />
    
    <!-- Open Graph -->
    <meta property="og:title" content="Fascino – Premium Fashion Store" />
    <meta property="og:description" content="Discover curated collections and premium fashion at Fascino." />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://fascino-store-pwa.vercel.app/" />
    <meta property="og:image" content="https://fascino-store-pwa.vercel.app/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    
    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Fascino – Premium Fashion Store" />
    <meta name="twitter:description" content="Discover curated collections and premium fashion at Fascino." />
    <meta name="twitter:image" content="https://fascino-store-pwa.vercel.app/og-image.png" />
    
    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml" href="/logo.svg" />
    
    <!-- Apple Touch Icon -->
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    
    <!-- PWA Theme Colors -->
    <meta name="theme-color" content="#d4a5a5" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Fascino Admin" />
    
    <!-- Mobile Web App -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="format-detection" content="telephone=no" />
    
    <!-- Safe Area for notched devices -->
    <style>
      :root {
        --sat: env(safe-area-inset-top);
        --sar: env(safe-area-inset-right);
        --sab: env(safe-area-inset-bottom);
        --sal: env(safe-area-inset-left);
      }
    </style>
    
    <!-- Preconnect to Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
