<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Title & meta -->
    <title>Fascino — By Payal</title>
    <meta name="description" content="Discover curated collections and premium Indo-Western fashion at Fascino by Payal." />
    <meta name="author" content="Fascino by Payal" />

    <!-- Favicon: SVG monogram (all modern browsers), ICO fallback for legacy -->
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="alternate icon" href="/favicon.ico" />
    <link rel="apple-touch-icon" href="/logo.svg" />

    <!-- PWA / mobile web app -->
    <meta name="theme-color" content="#0a0a0a" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Fascino" />
    <meta name="format-detection" content="telephone=no" />

    <!-- Open Graph -->
    <meta property="og:title" content="Fascino — Premium Indo-Western Fashion" />
    <meta property="og:description" content="Discover curated collections and premium Indo-Western fashion at Fascino by Payal." />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Fascino — Premium Indo-Western Fashion" />
    <meta name="twitter:description" content="Discover curated collections and premium Indo-Western fashion at Fascino by Payal." />
    <meta name="twitter:image" content="/og-image.png" />
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
